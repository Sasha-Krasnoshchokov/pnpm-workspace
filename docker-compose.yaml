services:
  server-dev:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
      target: development
    container_name: server-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
    env_file:
      - apps/server/.env
    ports:
      - 3210:3210
    environment:
      - TSX_LOADER_FALLBACK=1
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=100
    command: >
      sh -c "npx tsx watch src/server.js"
